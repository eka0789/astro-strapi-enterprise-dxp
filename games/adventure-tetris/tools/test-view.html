<!doctype html>
<!-- LOCAL VISUAL TEST HARNESS ONLY - not part of the shipped game.
     Renders the game in an iframe at a precise viewport size.
     Query params: w, h (viewport px), touch=1 (force touch controls). -->
<html>
<head><meta charset="utf-8"><title>Adventris test view</title></head>
<body style="margin:0;background:#020617;overflow:hidden">
<iframe id="f" style="border:0;display:block" src="/"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const w = parseInt(q.get('w') || '390', 10);
  const h = parseInt(q.get('h') || '844', 10);
  const touch = q.get('touch') === '1' ? '&touch=1' : '';
  const f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = '/?' + (touch ? 'touch=1' : '');
</script>
</body>
</html>
